---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Turn on the daily package list refresh and upgrade
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (ubuntu-hardening-roles).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/51hardening-periodic
    owner: root
    group: root
    mode: "0644"

- name: Set the unattended-upgrades behaviour
  ansible.builtin.template:
    src: 52hardening-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52hardening-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
