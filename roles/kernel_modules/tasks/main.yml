---
- name: Make sure the modprobe.d directory exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable the modules
  ansible.builtin.template:
    src: 60-hardening.conf.j2
    dest: /etc/modprobe.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
