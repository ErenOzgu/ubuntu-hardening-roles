---
- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Write the audit rules
  ansible.builtin.template:
    src: 60-hardening.rules.j2
    dest: /etc/audit/rules.d/60-hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd.service
    enabled: true
    state: started

# The handler only runs when the file changed; this catches rules that were cleared with "auditctl -D".
- name: Check that the rules are loaded
  ansible.builtin.shell: set -o pipefail && auditctl -l | grep -Eq -- '(-k |key=)identity'
  args:
    executable: /bin/bash
  register: auditd_loaded
  changed_when: false
  failed_when: false

- name: Load the rules again if they are missing
  ansible.builtin.command: augenrules --load
  when: auditd_loaded.rc != 0
  changed_when: true
